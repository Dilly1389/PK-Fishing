<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PK Fishing</title>
<style>
  :root{
    --dam:#B3121F;
    --dam-deep:#7A0611;
    --khaki:#F1B9B9;
    --rust:#E63946;
    --cream:#FFFFFF;
    --paper:#FAFAFA;
    --card-bg:#ffffff;
    --ink:#2A1414;
    --muted:#9C6B6B;
    --line:#F0D6D6;
    --catch-green:#A61B2B;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --dam:#7A0F1A;
      --dam-deep:#4A0810;
      --khaki:#E8AFAF;
      --rust:#FF5464;
      --cream:#FFFFFF;
      --paper:#141010;
      --card-bg:#1F1616;
      --ink:#F5EAEA;
      --muted:#C79999;
      --line:#3A2323;
      --catch-green:#C83244;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--dam);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:Rockwell,"Roboto Slab",Georgia,serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow:0 0 60px rgba(0,0,0,0.35);
  }
  header.top{
    background:linear-gradient(180deg,var(--dam) 0%,var(--dam-deep) 100%);
    color:var(--cream);
    padding:22px 16px 16px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  header.top h1{
    font-size:24px;margin:0;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  header.top p{margin:0;color:var(--khaki);font-size:13px;}
  .status-dot{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    background:#9CA3AF;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(255,255,255,0.15);
    transition:background .3s ease;
  }
  .status-dot.connected{background:#22C55E;box-shadow:0 0 6px rgba(34,197,94,0.8),0 0 0 3px rgba(255,255,255,0.15);}
  #db-status{display:none;background:#b23a1f;color:#fff;padding:8px 14px;font-size:12px;text-align:center;}
  nav.tabs{display:flex;background:var(--dam-deep);position:sticky;top:0;z-index:10;}
  nav.tabs button{
    flex:1;padding:13px 4px;background:transparent;border:none;
    border-bottom:3px solid transparent;color:rgba(239,232,216,0.55);
    font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;
    cursor:pointer;font-family:inherit;
  }
  nav.tabs button.active{color:#fff;border-bottom-color:var(--rust);}
  main{padding:16px 14px 60px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .angler-bar{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 12px;
    background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);
  }
  .angler-bar label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;flex-shrink:0;}
  .angler-bar select{
    flex:1;min-width:0;padding:9px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--card-bg);color:var(--ink);font-size:15px;font-family:inherit;
  }

  section.card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px 16px;margin-bottom:14px;
  }
  section.card h2{font-size:15px;margin:0 0 12px;color:var(--khaki);}
  .rod-card h3{
    font-size:17px;margin:0 0 14px;color:var(--ink);display:flex;align-items:center;gap:8px;
  }
  .rod-card h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rust);flex-shrink:0;}

  .bobber-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .bobber{
    width:84px;height:84px;flex-shrink:0;border-radius:50%;
    background:var(--dam-deep);
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .bobber.running{animation:bob 2.6s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.bobber.running{animation:none;}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .bobber .time{color:#fff;font-size:13px;font-weight:700;}
  .bobber-controls{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  .btn{
    border:none;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;flex:1;min-width:70px;
  }
  .btn-start{background:var(--catch-green);color:#fff;}
  .btn-pause{background:var(--khaki);color:var(--ink);}
  .btn-reset{background:transparent;color:var(--muted);border:1px solid var(--line);}

  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    font-weight:700;color:var(--muted);margin-bottom:5px;
  }
  .field textarea,.field input,.field select{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:16px;resize:vertical;background:var(--card-bg);color:var(--ink);
  }
  .field textarea{min-height:52px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;min-width:0;}

  .divider{border:none;border-top:1px solid var(--line);margin:14px 0;}
  .sub-heading{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}

  .catch-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .catch-toggle button{
    flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--card-bg);font-weight:700;font-family:inherit;cursor:pointer;
    color:var(--muted);font-size:13.5px;
  }
  .catch-toggle button.sel-yes.active{background:var(--catch-green);color:#fff;border-color:var(--catch-green);}
  .catch-toggle button.sel-no.active{background:var(--muted);color:var(--card-bg);border-color:var(--muted);}

  .catch-log-item{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:13.5px;gap:8px;
  }
  .catch-log-item:last-child{border-bottom:none;}
  .catch-log-item .del{background:none;border:none;color:#c04;font-size:12.5px;cursor:pointer;flex-shrink:0;}

  .people-list{list-style:none;padding:0;margin:0;}
  .people-list li{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;
  }
  .people-list li:last-child{border-bottom:none;}
  .people-list .who b{font-size:15px;}
  .people-list .who .pill{
    display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
    background:var(--dam);color:#fff;font-size:11px;font-weight:700;
    vertical-align:middle;
  }
  .people-list .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    border:1px solid var(--line);background:var(--card-bg);color:var(--ink);border-radius:7px;
    padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .mini-btn.danger{color:#c04;}

  .lb-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .lb-item:last-child{border-bottom:none;}
  .lb-rank{
    width:28px;height:28px;border-radius:50%;background:var(--dam);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  }
  .lb-item:nth-child(1) .lb-rank{background:var(--rust);}
  .lb-name-btn{
    background:none;border:none;padding:0;font-family:inherit;color:var(--ink);
    font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:underline;
    text-decoration-color:transparent;text-align:left;
  }
  .lb-name-btn:hover{text-decoration-color:var(--rust);}
  .lb-dam{font-size:12px;color:var(--muted);}
  .lb-stats{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);}
  .lb-stats b{color:var(--ink);font-size:14.5px;}

  .empty{text-align:center;padding:20px 10px;color:var(--muted);font-size:13.5px;}
  .primary-btn{
    width:100%;padding:12px;background:var(--rust);color:#fff;border:none;border-radius:9px;
    font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;
  }
  .status{font-size:12px;color:var(--muted);margin-top:8px;min-height:14px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;
    align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:var(--card-bg);border-radius:16px;padding:24px 22px;max-width:320px;width:100%;
    text-align:center;border:1px solid var(--line);
  }
  .modal-card h3{margin:0 0 10px;font-size:18px;color:var(--ink);}
  .modal-card p{margin:4px 0;font-size:14px;color:var(--muted);}
  .modal-card p b{color:var(--ink);}
  .modal-card .primary-btn{margin-top:18px;}
  .modal-card.wide{max-width:440px;max-height:82vh;overflow-y:auto;text-align:left;}
  .profile-summary{
    display:flex;gap:16px;margin:10px 0 16px;padding-bottom:12px;
    border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);
  }
  .profile-summary b{color:var(--ink);display:block;font-size:17px;}
  .profile-catch{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .pc-head{font-weight:700;font-size:14px;margin-bottom:4px;color:var(--ink);}
  .pc-line{font-size:12.5px;margin:2px 0;color:var(--ink);}
  .pc-line.muted{color:var(--muted);}

  @media (max-width:420px){
    .bobber-row{flex-direction:column;align-items:stretch;}
    .bobber{margin:0 auto;}
    .bobber-controls{justify-content:stretch;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>PK Fishing <span class="status-dot" id="conn-dot" title="Checking connection..."></span></h1>
  </header>
  <div id="db-status"></div>

  <nav class="tabs">
    <button data-tab="timers" class="active">Timers</button>
    <button data-tab="schedule">Fisherman</button>
    <button data-tab="leaderboard">Leaderboard</button>
  </nav>

  <main>

    <!-- TIMERS -->
    <div class="panel active" id="panel-timers">
      <div class="angler-bar">
        <label>Fisherman</label>
        <select id="angler-select"></select>
      </div>
      <div id="rod-cards"></div>
    </div>

    <!-- FISHERMAN -->
    <div class="panel" id="panel-schedule">
      <section class="card">
        <h2>Add fisherman</h2>
        <div class="row2">
          <div class="field">
            <label>Name</label>
            <input type="text" id="new-person-name" placeholder="Name">
          </div>
          <div class="field">
            <label>Dam</label>
            <input type="text" id="new-person-dam" placeholder="Dam">
          </div>
        </div>
        <div class="field">
          <label>Competition / Weekend</label>
          <input type="text" id="new-person-competition" placeholder="e.g. October Weekend, Club Comp">
        </div>
        <div class="field">
          <label>Number of rods</label>
          <select id="new-person-rods">
            <option value="1">1 rod</option>
            <option value="2">2 rods</option>
            <option value="3" selected>3 rods</option>
          </select>
        </div>
        <button class="primary-btn" id="add-person-btn">Add fisherman</button>
        <div class="status" id="schedule-status"></div>
      </section>
      <section class="card">
        <h2>Fishermen fishing today</h2>
        <ul class="people-list" id="people-list"></ul>
      </section>
      <section class="card">
        <h2>Archived</h2>
        <ul class="people-list" id="archived-list"></ul>
      </section>
    </div>

    <!-- LEADERBOARD -->
    <div class="panel" id="panel-leaderboard">
      <section class="card">
        <h2>Leaderboard</h2>
        <div class="row2">
          <div class="field">
            <label>Dam</label>
            <select id="lb-filter-dam"><option value="">All dams</option></select>
          </div>
          <div class="field">
            <label>Competition</label>
            <select id="lb-filter-comp"><option value="">All competitions</option></select>
          </div>
        </div>
        <div class="field">
          <label>Fish type</label>
          <select id="lb-filter-type"><option value="">All types</option></select>
        </div>
        <div id="leaderboard-list"><div class="empty">No catches logged yet.</div></div>
      </section>
      <button class="primary-btn" id="refresh-lb-btn" style="background:var(--dam);">Refresh</button>
    </div>

  </main>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <div id="modal-body"></div>
    <div class="row2" style="margin-top:18px;">
      <button class="primary-btn" id="confirm-edit" style="background:var(--khaki);color:var(--ink);">Edit</button>
      <button class="primary-btn" id="confirm-correct">Correct</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="profile-modal">
  <div class="modal-card wide">
    <div id="profile-body"></div>
    <button class="primary-btn" id="profile-close">Close</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://quptwbxzstepwfeffljq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nnO3ZffPD-r08e4E1rjcPQ_47mGq7Xu';

const RODS = ['rod1','rod2','rod3'];
const RID_LABEL = {rod1:'Rod 1',rod2:'Rod 2',rod3:'Rod 3'};
let people = [];
let currentPersonId = null;
let currentPerson = null;
let catchToggle = {rod1:false, rod2:false, rod3:false};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmt(ms){
  if(ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  const hh = String(Math.floor(s/3600)).padStart(2,'0');
  const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return hh+':'+mm+':'+ss;
}
function elapsedMs(t){
  if(!t) return 0;
  return (t.accumulatedMs||0) + (t.running ? (Date.now()-t.startTs) : 0);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showDbError(msg){
  const el = document.getElementById('db-status');
  el.textContent = msg;
  el.style.display = 'block';
  setConnDot(false);
}
function clearDbError(){
  const el = document.getElementById('db-status');
  el.style.display = 'none';
  setConnDot(true);
}
function setConnDot(connected){
  const dot = document.getElementById('conn-dot');
  if(!dot) return;
  dot.classList.toggle('connected', connected);
  dot.title = connected ? 'Connected to database' : 'Not connected to database';
}

// ---------- Supabase REST helpers ----------
function sbHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, extra||{});
}
async function sbGet(path){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {headers: sbHeaders()});
  if(!res.ok) throw new Error('GET ' + path + ' failed: ' + res.status);
  return res.json();
}
async function sbPost(table, body){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method:'POST',
    headers: sbHeaders({'Prefer':'return=representation'}),
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('POST ' + table + ' failed: ' + res.status + ' ' + await res.text());
  return res.json();
}
async function sbUpsert(table, body, onConflict){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?on_conflict=' + onConflict, {
    method:'POST',
    headers: sbHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}),
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Upsert ' + table + ' failed: ' + res.status + ' ' + await res.text());
  return res.json();
}
async function sbPatch(table, filterQuery, body){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + filterQuery, {
    method:'PATCH',
    headers: sbHeaders({'Prefer':'return=representation'}),
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('PATCH ' + table + ' failed: ' + res.status);
  return res.json();
}
async function sbDelete(table, filterQuery){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + filterQuery, {
    method:'DELETE',
    headers: sbHeaders()
  });
  if(!res.ok) throw new Error('DELETE ' + table + ' failed: ' + res.status);
}

// ---------- Data layer (backed by Supabase) ----------
async function loadPeople(){
  try{
    people = await sbGet('fishermen?select=id,name,dam,rods,competition,archived&order=name.asc');
    clearDbError();
  }catch(e){
    console.error(e); people = [];
    showDbError('Could not reach Supabase. Check the project URL and anon key.');
  }
}

async function insertFisherman(id,name,dam,rods,competition){
  await sbPost('fishermen', {id,name,dam,rods,competition});
  const rows = RODS.map(r=>({fisherman_id:id, rod:r, running:false, start_ts:null, accumulated_ms:0, bom:'', hook1_note:'', hook2_note:''}));
  await sbPost('rod_state', rows);
}
async function deleteFisherman(id){
  await sbDelete('fishermen', 'id=eq.'+id);
}
async function updateFishermanRods(id, rods){
  await sbPatch('fishermen', 'id=eq.'+id, {rods});
}
async function archiveFisherman(id){
  await sbPatch('fishermen', 'id=eq.'+id, {archived:true});
}
async function unarchiveFisherman(id){
  await sbPatch('fishermen', 'id=eq.'+id, {archived:false});
}

async function loadPerson(id){
  try{
    const [fRows, rodRows, catchRows] = await Promise.all([
      sbGet('fishermen?id=eq.'+id+'&select=*'),
      sbGet('rod_state?fisherman_id=eq.'+id+'&select=*'),
      sbGet('catches?fisherman_id=eq.'+id+'&select=*&order=time.asc')
    ]);
    const f = fRows[0];
    if(!f) return null;
    const timers={}, notes={};
    RODS.forEach(r=>{
      const row = rodRows.find(x=>x.rod===r);
      timers[r] = row ? {running:row.running, startTs:row.start_ts, accumulatedMs:row.accumulated_ms} : {running:false,startTs:null,accumulatedMs:0};
      notes[r] = row ? {bom:row.bom||'', hook1:row.hook1_note||'', hook2:row.hook2_note||''} : {bom:'',hook1:'',hook2:''};
    });
    const catches = catchRows.map(c=>({
      id:c.id, caught:c.caught, rod:c.rod, hook:c.hook||'', type:c.fish_type||'', weight:c.weight||0,
      time: new Date(c.time).getTime(), timerElapsed:c.timer_elapsed_ms||0,
      bom:c.bom||'', hook1:c.hook1_note||'', hook2:c.hook2_note||''
    }));
    clearDbError();
    return {name:f.name, dam:f.dam, competition:f.competition||'', rods:f.rods||3, timers, notes, catches};
  }catch(e){
    console.error(e);
    showDbError('Could not reach Supabase. Check the project URL and anon key.');
    return null;
  }
}

async function saveRodState(personId, rod){
  if(!currentPerson) return;
  const t = currentPerson.timers[rod];
  const n = currentPerson.notes[rod];
  try{
    await sbUpsert('rod_state', {
      fisherman_id: personId, rod,
      running: t.running, start_ts: t.startTs, accumulated_ms: t.accumulatedMs,
      bom: n.bom, hook1_note: n.hook1, hook2_note: n.hook2
    }, 'fisherman_id,rod');
    clearDbError();
  }catch(e){ console.error(e); showDbError('Could not save to Supabase.'); }
}

async function insertCatch(personId, entry){
  try{
    await sbPost('catches', {
      id: entry.id, fisherman_id: personId, rod: entry.rod, hook: entry.hook,
      caught: entry.caught, fish_type: entry.type, weight: entry.weight,
      time: new Date(entry.time).toISOString(), timer_elapsed_ms: entry.timerElapsed,
      bom: entry.bom, hook1_note: entry.hook1, hook2_note: entry.hook2
    });
    clearDbError();
  }catch(e){ console.error(e); showDbError('Could not save catch to Supabase.'); }
}
async function removeCatch(catchId){
  try{ await sbDelete('catches', 'id=eq.'+catchId); clearDbError(); }
  catch(e){ console.error(e); showDbError('Could not delete from Supabase.'); }
}

// ---------- UI ----------
function populateAnglerSelect(){
  const sel = document.getElementById('angler-select');
  const active = people.filter(p=>!p.archived);
  sel.innerHTML = active.length
    ? active.map(p => `<option value="${p.id}">${escapeHtml(p.name)} — ${escapeHtml(p.dam)}</option>`).join('')
    : '<option value="">Add a fisherman on the Fisherman tab</option>';
  if(currentPersonId) sel.value = currentPersonId;
}

function rodCardHtml(r){
  return `
    <section class="card rod-card" id="rodcard-${r}">

function buildRodCards(){
  document.getElementById('rod-cards').innerHTML = RODS.map(rodCardHtml).join('');
  attachRodCardHandlers();
}

function attachRodCardHandlers(){
  document.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!currentPerson) return;
      const rod = btn.dataset.rod;
      const t = currentPerson.timers[rod];
      const action = btn.dataset.action;
      if(action==='start' && !t.running){ t.running=true; t.startTs=Date.now(); }
      if(action==='pause' && t.running){ t.accumulatedMs += Date.now()-t.startTs; t.running=false; t.startTs=null; }
      if(action==='reset'){ currentPerson.timers[rod] = {running:false,startTs:null,accumulatedMs:0}; }
      renderTimers();
      await saveRodState(currentPersonId, rod);
    });
  });
  document.querySelectorAll('.rod-field').forEach(ta=>{
    ta.addEventListener('blur', async ()=>{
      if(!currentPerson) return;
      currentPerson.notes[ta.dataset.rod][ta.dataset.key] = ta.value;
      await saveRodState(currentPersonId, ta.dataset.rod);
    });
  });
  document.querySelectorAll('.catch-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rod = btn.dataset.rod;
      const yes = btn.dataset.yn === 'yes';
      catchToggle[rod] = yes;
      document.querySelectorAll('.catch-toggle[data-rod="'+rod+'"] button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('.catch-fields[data-rod="'+rod+'"]').style.display = yes ? 'block' : 'none';
    });
  });
  document.querySelectorAll('.catch-type').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const otherEl = document.querySelector('.catch-type-other[data-rod="'+sel.dataset.rod+'"]');
      if(otherEl) otherEl.style.display = sel.value === 'Other' ? 'block' : 'none';
    });
  });
  document.querySelectorAll('.log-catch-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rod = btn.dataset.rod;
      if(!currentPerson) return;
      const caught = catchToggle[rod];
      const hookEl = document.querySelector('.catch-hook[data-rod="'+rod+'"]');
      const typeEl = document.querySelector('.catch-type[data-rod="'+rod+'"]');
      const typeOtherEl = document.querySelector('.catch-type-other[data-rod="'+rod+'"]');
      const typeValue = typeEl.value === 'Other' ? typeOtherEl.value : typeEl.value;
      const weightEl = document.querySelector('.catch-weight[data-rod="'+rod+'"]');
      const bomEl = document.querySelector('.rod-field[data-rod="'+rod+'"][data-key="bom"]');
      const hook1El = document.querySelector('.rod-field[data-rod="'+rod+'"][data-key="hook1"]');
      const hook2El = document.querySelector('.rod-field[data-rod="'+rod+'"][data-key="hook2"]');

      const entry = {
        id: uid(),
        caught,
        rod,
        hook: caught ? hookEl.value : '',
        type: caught ? typeValue : '',
        weight: caught ? (parseFloat(weightEl.value) || 0) : 0,
        time: Date.now(),
        timerElapsed: elapsedMs(currentPerson.timers[rod]),
        bom: bomEl.value,
        hook1: hook1El.value,
        hook2: hook2El.value
      };
      showConfirmation(entry);
    });
  });
}

let pendingEntry = null;

function showConfirmation(entry){
  pendingEntry = entry;
  const timeStr = new Date(entry.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const timerStr = fmt(entry.timerElapsed||0);
  let html = `<h3>${entry.caught ? 'Caught a fish?' : 'No catch?'}</h3>`;
  html += `<p><b>${RID_LABEL[entry.rod]}</b>${entry.caught ? ' · '+escapeHtml(entry.hook) : ''}</p>`;
  if(entry.caught){
    html += `<p>${escapeHtml(entry.type||'Fish')} — <b>${entry.weight}kg</b></p>`;
  }
  html += `<p>Time of day: <b>${timeStr}</b></p>`;
  html += `<p>Rod timer: <b>${timerStr}</b></p>`;
  html += `<p style="font-size:12px;">Bom: ${escapeHtml(entry.bom||'—')}</p>`;
  html += `<p style="font-size:12px;">Hook 1: ${escapeHtml(entry.hook1||'—')} · Hook 2: ${escapeHtml(entry.hook2||'—')}</p>`;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('confirm-modal').classList.add('open');
}

document.getElementById('confirm-correct').addEventListener('click', async ()=>{
  if(!pendingEntry || !currentPerson) return;
  const entry = pendingEntry;
  const rod = entry.rod;
  currentPerson.catches.push(entry);

  // Clear this rod's notes and reset its timer for the next session
  currentPerson.notes[rod] = {bom:'', hook1:'', hook2:''};
  currentPerson.timers[rod] = {running:false, startTs:null, accumulatedMs:0};

  const typeEl = document.querySelector('.catch-type[data-rod="'+rod+'"]');
  const typeOtherEl = document.querySelector('.catch-type-other[data-rod="'+rod+'"]');
  const weightEl = document.querySelector('.catch-weight[data-rod="'+rod+'"]');
  if(typeEl) typeEl.value='';
  if(typeOtherEl){ typeOtherEl.value=''; typeOtherEl.style.display='none'; }
  if(weightEl) weightEl.value='';

  renderCatchList(rod);
  renderNotes();
  renderTimers();

  document.getElementById('confirm-modal').classList.remove('open');
  pendingEntry = null;
  await saveRodState(currentPersonId, rod);
  await insertCatch(currentPersonId, entry);
});

document.getElementById('confirm-edit').addEventListener('click', ()=>{
  pendingEntry = null;
  document.getElementById('confirm-modal').classList.remove('open');
});

function catchDetailHtml(c){
  const timeStr = new Date(c.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const timerStr = fmt(c.timerElapsed||0);
  let html = `<div class="profile-catch">
    <div class="pc-head">${RID_LABEL[c.rod] || c.rod}${c.caught ? ' · '+escapeHtml(c.hook||'') : ' · No catch'}</div>`;
  if(c.caught){
    html += `<div class="pc-line">${escapeHtml(c.type||'Fish')} — ${c.weight}kg</div>`;
  }
  html += `<div class="pc-line muted">Time of day: ${timeStr} &middot; Rod timer: ${timerStr}</div>`;
  html += `<div class="pc-line muted">Bom: ${escapeHtml(c.bom||'—')}</div>`;
  html += `<div class="pc-line muted">Hook 1: ${escapeHtml(c.hook1||'—')}</div>`;
  html += `<div class="pc-line muted">Hook 2: ${escapeHtml(c.hook2||'—')}</div>`;
  html += `</div>`;
  return html;
}

function buildDistinctOptions(values, current){
  const set = new Set(values.filter(Boolean));
  const arr = [...set].sort((a,b)=>a.localeCompare(b));
  let html = '<option value="">None</option>';
  arr.forEach(v=>{
    html += `<option value="${escapeHtml(v)}" ${v===current?'selected':''}>${escapeHtml(v)}</option>`;
  });
  if(current && !arr.includes(current)){
    html += `<option value="${escapeHtml(current)}" selected>${escapeHtml(current)}</option>`;
  }
  html += `<option value="__other__">+ Add new...</option>`;
  return html;
}

async function openProfile(personId){
  const p = people.find(x=>x.id===personId);
  const rec = await loadPerson(personId);
  if(!p) return;
  const catches = rec && rec.catches ? rec.catches.slice().sort((a,b)=> b.time-a.time) : [];
  const caughtOnly = catches.filter(c=>c.caught);
  const totalWeight = caughtOnly.reduce((s,c)=>s+(c.weight||0),0);
  const dams = people.map(x=>x.dam);
  const comps = people.map(x=>x.competition);

  let html = `<h3>${escapeHtml(p.name)}</h3>`;
  html += `<div class="field">
      <label>Dam</label>
      <select id="profile-dam-select">${buildDistinctOptions(dams, p.dam||'')}</select>
      <input type="text" id="profile-dam-other" placeholder="New dam name" style="display:none;margin-top:6px;">
    </div>`;
  html += `<div class="field">
      <label>Competition / Weekend</label>
      <select id="profile-comp-select">${buildDistinctOptions(comps, p.competition||'')}</select>
      <input type="text" id="profile-comp-other" placeholder="New competition / weekend" style="display:none;margin-top:6px;">
    </div>`;
  html += `<button class="primary-btn" id="profile-save-btn">Save</button>`;
  html += `<div class="status" id="profile-save-status"></div>`;
  html += `<div class="profile-summary">
      <div><b>${caughtOnly.length}</b>catches</div>
      <div><b>${totalWeight.toFixed(2)}kg</b>total</div>
      <div><b>${(rec && rec.rods) || p.rods || 3}</b>rods</div>
    </div>`;
  html += catches.length ? catches.map(catchDetailHtml).join('') : '<div class="empty">No entries logged yet.</div>';
  document.getElementById('profile-body').innerHTML = html;
  document.getElementById('profile-modal').classList.add('open');

  document.getElementById('profile-dam-select').addEventListener('change', (e)=>{
    document.getElementById('profile-dam-other').style.display = e.target.value==='__other__' ? 'block' : 'none';
  });
  document.getElementById('profile-comp-select').addEventListener('change', (e)=>{
    document.getElementById('profile-comp-other').style.display = e.target.value==='__other__' ? 'block' : 'none';
  });
  document.getElementById('profile-save-btn').addEventListener('click', async ()=>{
    const damSel = document.getElementById('profile-dam-select').value;
    const damOther = document.getElementById('profile-dam-other').value.trim();
    const compSel = document.getElementById('profile-comp-select').value;
    const compOther = document.getElementById('profile-comp-other').value.trim();
    const dam = damSel === '__other__' ? damOther : damSel;
    const competition = compSel === '__other__' ? compOther : compSel;
    const st = document.getElementById('profile-save-status');
    st.textContent = 'Saving...';
    try{
      await sbPatch('fishermen', 'id=eq.'+p.id, {dam, competition});
      p.dam = dam; p.competition = competition;
      if(currentPersonId===p.id && currentPerson){ currentPerson.dam = dam; currentPerson.competition = competition; }
      populateAnglerSelect();
      renderPeopleList();
      st.textContent = 'Saved.';
      setTimeout(()=> st.textContent='', 1500);
    }catch(e){
      console.error(e);
      st.textContent = 'Could not save — check the Supabase connection.';
    }
  });
}
document.getElementById('profile-close').addEventListener('click', ()=>{
  document.getElementById('profile-modal').classList.remove('open');
});

async function setActivePerson(id){
  currentPersonId = id;
  if(!id){ currentPerson = null; renderAll(); return; }
  currentPerson = await loadPerson(id);
  document.getElementById('angler-select').value = id;
  renderAll();
}

function renderAll(){
  buildRodCards();
  renderRodVisibility();
  renderTimers();
  renderNotes();
  RODS.forEach(renderCatchList);
}
function renderRodVisibility(){
  RODS.forEach((r,i)=>{
    const idx = i+1;
    const card = document.getElementById('rodcard-'+r);
    if(!card) return;
    card.style.display = (currentPerson && currentPerson.rods >= idx) ? '' : 'none';
  });
}
function renderTimers(){
  RODS.forEach(r=>{
    const el = document.getElementById('time-'+r);
    if(!el) return;
    const t = currentPerson ? currentPerson.timers[r] : null;
    el.textContent = fmt(elapsedMs(t));
    document.getElementById('bobber-'+r).classList.toggle('running', !!(t && t.running));
  });
}
function renderNotes(){
  RODS.forEach(r=>{
    ['bom','hook1','hook2'].forEach(k=>{
      const el = document.querySelector('.rod-field[data-rod="'+r+'"][data-key="'+k+'"]');
      if(el) el.value = currentPerson ? currentPerson.notes[r][k] : '';
    });
  });
}
function renderCatchList(rod){
  const el = document.querySelector('.catch-list[data-rod="'+rod+'"]');
  if(!el) return;
  const entries = currentPerson ? currentPerson.catches.filter(c=>c.rod===rod) : [];
  if(entries.length===0){ el.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
  el.innerHTML = entries.slice().reverse().map(c=>{
    const label = c.caught ? `${escapeHtml(c.type||'Fish')} — ${c.weight}kg (${escapeHtml(c.hook||'')})` : `No catch`;
    const time = new Date(c.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<div class="catch-log-item"><span>${label} · ${time}</span><button class="del" data-id="${c.id}" data-rod="${rod}">Remove</button></div>`;
  }).join('');
  el.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      currentPerson.catches = currentPerson.catches.filter(c=>c.id!==btn.dataset.id);
      renderCatchList(rod);
      await removeCatch(btn.dataset.id);
    });
  });
}

// Tabs
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='schedule') renderPeopleList();
    if(btn.dataset.tab==='leaderboard') renderLeaderboard();
  });
});
document.getElementById('angler-select').addEventListener('change', e=> setActivePerson(e.target.value));
setInterval(renderTimers, 1000);

// Fisherman (schedule)
document.getElementById('add-person-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('new-person-name').value.trim();
  const dam = document.getElementById('new-person-dam').value.trim();
  const competition = document.getElementById('new-person-competition').value.trim();
  const rods = parseInt(document.getElementById('new-person-rods').value) || 3;
  const st = document.getElementById('schedule-status');
  if(!name){ st.textContent = 'Enter a name.'; return; }
  const id = uid();
  st.textContent = 'Adding...';
  try{
    await insertFisherman(id, name, dam, rods, competition);
    people.push({id, name, dam, rods, competition});
    document.getElementById('new-person-name').value='';
    document.getElementById('new-person-dam').value='';
    document.getElementById('new-person-competition').value='';
    st.textContent = 'Added.';
    setTimeout(()=> st.textContent='', 1500);
    populateAnglerSelect();
    renderPeopleList();
    if(!currentPersonId) setActivePerson(id);
  }catch(e){
    console.error(e);
    st.textContent = 'Could not add — check Supabase connection.';
  }
});

function renderPeopleList(){
  const activeEl = document.getElementById('people-list');
  const archivedEl = document.getElementById('archived-list');
  const active = people.filter(p=>!p.archived);
  const archived = people.filter(p=>p.archived);

  if(active.length===0){
    activeEl.innerHTML = '<div class="empty">No fishermen added yet.</div>';
  }else{
    activeEl.innerHTML = active.map(p=>`
      <li>
        <div class="who"><button class="lb-name-btn" data-id="${p.id}">${escapeHtml(p.name)}</button>${p.competition ? '<span class="pill">'+escapeHtml(p.competition)+'</span>' : ''}</div>
        <div class="actions">
          <select class="mini-btn rods-select" data-id="${p.id}">
            <option value="1" ${p.rods==1?'selected':''}>1 rod</option>
            <option value="2" ${p.rods==2?'selected':''}>2 rods</option>
            <option value="3" ${(!p.rods||p.rods==3)?'selected':''}>3 rods</option>
          </select>
          <button class="mini-btn" data-select="${p.id}">${p.id===currentPersonId?'Active':'Select'}</button>
          <button class="mini-btn" data-archive="${p.id}">Archive</button>
        </div>
      </li>`).join('');
  }

  if(archived.length===0){
    archivedEl.innerHTML = '<div class="empty">No archived fishermen.</div>';
  }else{
    archivedEl.innerHTML = archived.map(p=>`
      <li>
        <div class="who"><button class="lb-name-btn" data-id="${p.id}">${escapeHtml(p.name)}</button>${p.competition ? '<span class="pill">'+escapeHtml(p.competition)+'</span>' : ''}</div>
        <div class="actions">
          <button class="mini-btn" data-unarchive="${p.id}">Unarchive</button>
          <button class="mini-btn danger" data-remove="${p.id}">Delete</button>
        </div>
      </li>`).join('');
  }

  [activeEl, archivedEl].forEach(el=>{
    el.querySelectorAll('.lb-name-btn').forEach(b=>{
      b.addEventListener('click', ()=> openProfile(b.dataset.id));
    });
  });

  activeEl.querySelectorAll('[data-select]').forEach(b=>{
    b.addEventListener('click', ()=>{ setActivePerson(b.dataset.select); renderPeopleList(); });
  });
  activeEl.querySelectorAll('.rods-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const id = sel.dataset.id;
      const rods = parseInt(sel.value);
      const p = people.find(x=>x.id===id);
      if(p) p.rods = rods;
      await updateFishermanRods(id, rods);
      if(currentPersonId===id){
        currentPerson.rods = rods;
        renderRodVisibility();
      }
    });
  });
  activeEl.querySelectorAll('[data-archive]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.archive;
      await archiveFisherman(id);
      const p = people.find(x=>x.id===id);
      if(p) p.archived = true;
      if(currentPersonId===id){ currentPersonId=null; currentPerson=null; }
      populateAnglerSelect();
      renderPeopleList();
      renderAll();
    });
  });

  archivedEl.querySelectorAll('[data-unarchive]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.unarchive;
      await unarchiveFisherman(id);
      const p = people.find(x=>x.id===id);
      if(p) p.archived = false;
      populateAnglerSelect();
      renderPeopleList();
    });
  });
  archivedEl.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.remove;
      await deleteFisherman(id);
      people = people.filter(p=>p.id!==id);
      if(currentPersonId===id){ currentPersonId=null; currentPerson=null; }
      populateAnglerSelect();
      renderPeopleList();
      renderAll();
    });
  });
}

// Leaderboard
function populateSelectPreserving(selectEl, values, allLabel){
  const current = selectEl.value;
  const distinct = [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  selectEl.innerHTML = `<option value="">${allLabel}</option>` +
    distinct.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  if(distinct.includes(current)) selectEl.value = current;
}

async function renderLeaderboard(){
  const el = document.getElementById('leaderboard-list');
  el.innerHTML = '<div class="empty">Loading...</div>';
  if(people.length===0){ el.innerHTML = '<div class="empty">No fishermen added yet.</div>'; return; }

  const perPersonCatches = {};
  const allTypes = [];
  for(const p of people){
    const rec = await loadPerson(p.id);
    const catches = (rec && rec.catches) ? rec.catches.filter(c=>c.caught) : [];
    perPersonCatches[p.id] = catches;
    catches.forEach(c=>{ if(c.type) allTypes.push(c.type); });
  }

  populateSelectPreserving(document.getElementById('lb-filter-dam'), people.map(p=>p.dam), 'All dams');
  populateSelectPreserving(document.getElementById('lb-filter-comp'), people.map(p=>p.competition), 'All competitions');
  populateSelectPreserving(document.getElementById('lb-filter-type'), allTypes, 'All types');

  const damFilter = document.getElementById('lb-filter-dam').value;
  const compFilter = document.getElementById('lb-filter-comp').value;
  const typeFilter = document.getElementById('lb-filter-type').value;

  const stats = people
    .filter(p => (!damFilter || p.dam===damFilter) && (!compFilter || p.competition===compFilter))
    .map(p=>{
      let catches = perPersonCatches[p.id] || [];
      if(typeFilter) catches = catches.filter(c=>c.type===typeFilter);
      const totalWeight = catches.reduce((s,c)=>s+(c.weight||0),0);
      const biggest = catches.reduce((b,c)=> (c.weight||0) > (b?b.weight:0) ? c : b, null);
      return {id:p.id, name:p.name, dam:p.dam, count:catches.length, totalWeight, biggest};
    });

  stats.sort((a,b)=> b.totalWeight - a.totalWeight || b.count - a.count);
  if(stats.length===0 || stats.every(s=>s.count===0)){ el.innerHTML = '<div class="empty">No catches match these filters.</div>'; return; }
  el.innerHTML = stats.map((s,i)=>`
    <div class="lb-item">
      <div class="lb-rank">${i+1}</div>
      <div>
        <button class="lb-name-btn" data-id="${s.id}">${escapeHtml(s.name)}</button>
        <div class="lb-dam">${escapeHtml(s.dam||'')}</div>
      </div>
      <div class="lb-stats">
        <div><b>${s.totalWeight.toFixed(2)}kg</b> total</div>
        <div>${s.count} catch${s.count===1?'':'es'}${s.biggest? ' · biggest '+s.biggest.weight+'kg '+escapeHtml(s.biggest.type||''):''}</div>
      </div>
    </div>`).join('');
  el.querySelectorAll('.lb-name-btn').forEach(b=>{
    b.addEventListener('click', ()=> openProfile(b.dataset.id));
  });
}
document.getElementById('refresh-lb-btn').addEventListener('click', renderLeaderboard);
document.getElementById('lb-filter-dam').addEventListener('change', renderLeaderboard);
document.getElementById('lb-filter-comp').addEventListener('change', renderLeaderboard);
document.getElementById('lb-filter-type').addEventListener('change', renderLeaderboard);

(async function init(){
  await loadPeople();
  populateAnglerSelect();
  const activePeople = people.filter(p=>!p.archived);
  if(activePeople.length>0) await setActivePerson(activePeople[0].id);
  renderPeopleList();
})();
</script>
