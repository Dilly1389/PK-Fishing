<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PK Fishing — Leaderboard</title>
<style>
  :root{
    --dam:#B3121F;
    --dam-deep:#7A0611;
    --khaki:#F1B9B9;
    --rust:#E63946;
    --cream:#FFFFFF;
    --paper:#FAFAFA;
    --card-bg:#ffffff;
    --ink:#2A1414;
    --muted:#9C6B6B;
    --line:#F0D6D6;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --dam:#7A0F1A;
      --dam-deep:#4A0810;
      --khaki:#E8AFAF;
      --rust:#FF5464;
      --cream:#FFFFFF;
      --paper:#141010;
      --card-bg:#1F1616;
      --ink:#F5EAEA;
      --muted:#C79999;
      --line:#3A2323;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--dam);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;}
  h1,h2{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;letter-spacing:-0.01em;}
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 60px rgba(0,0,0,0.35);}
  header.top{
    background:linear-gradient(180deg,var(--dam) 0%,var(--dam-deep) 100%);
    color:var(--cream);padding:22px 16px 16px;text-align:center;
  }
  header.top h1{font-size:22px;margin:0;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;}
  header.top p{margin:6px 0 0;color:var(--khaki);font-size:12.5px;}
  .status-dot{
    display:inline-block;width:10px;height:10px;border-radius:50%;background:#9CA3AF;
    flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,0.15);transition:background .3s ease;
  }
  .status-dot.connected{background:#22C55E;box-shadow:0 0 6px rgba(34,197,94,0.8),0 0 0 3px rgba(255,255,255,0.15);}
  #db-status{display:none;background:#b23a1f;color:#fff;padding:8px 14px;font-size:12px;text-align:center;}
  main{padding:16px 14px 40px;}
  section.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:14px;}
  section.card h2{font-size:15px;margin:0 0 12px;color:var(--khaki);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field select{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:15px;background:var(--card-bg);color:var(--ink);
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;min-width:0;}
  .lb-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .lb-item:last-child{border-bottom:none;}
  .lb-rank{
    width:28px;height:28px;border-radius:50%;background:var(--dam);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  }
  .lb-item:nth-child(1) .lb-rank{background:var(--rust);}
  .lb-name{font-weight:700;font-size:14.5px;}
  .lb-dam{font-size:12px;color:var(--muted);}
  .lb-stats{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);}
  .lb-stats b{color:var(--ink);font-size:14.5px;}
  .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13.5px;}
  .primary-btn{
    width:100%;padding:12px;background:var(--dam);color:#fff;border:none;border-radius:9px;
    font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;
  }
  .updated-line{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>PK Fishing <span class="status-dot" id="conn-dot" title="Checking connection..."></span></h1>
    <p>Leaderboard — spectator view</p>
  </header>
  <div id="db-status"></div>

  <main>
    <section class="card">
      <h2>Filters</h2>
      <div class="row2">
        <div class="field">
          <label>Dam</label>
          <select id="lb-filter-dam"><option value="">All dams</option></select>
        </div>
        <div class="field">
          <label>Competition</label>
          <select id="lb-filter-comp"><option value="">All competitions</option></select>
        </div>
      </div>
      <div class="field">
        <label>Fish type</label>
        <select id="lb-filter-type"><option value="">All types</option></select>
      </div>
    </section>

    <section class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboard-list"><div class="empty">Loading...</div></div>
      <div class="updated-line" id="updated-line"></div>
    </section>

    <button class="primary-btn" id="refresh-btn">Refresh now</button>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://quptwbxzstepwfeffljq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nnO3ZffPD-r08e4E1rjcPQ_47mGq7Xu';
const REFRESH_MS = 30000;

let people = [];

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showDbError(msg){
  const el = document.getElementById('db-status');
  el.textContent = msg;
  el.style.display = 'block';
  setConnDot(false);
}
function clearDbError(){
  document.getElementById('db-status').style.display = 'none';
  setConnDot(true);
}
function setConnDot(connected){
  const dot = document.getElementById('conn-dot');
  if(!dot) return;
  dot.classList.toggle('connected', connected);
  dot.title = connected ? 'Connected to database' : 'Not connected to database';
}

function sbHeaders(){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
}
async function sbGet(path){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {headers: sbHeaders()});
  if(!res.ok) throw new Error('GET ' + path + ' failed: ' + res.status);
  return res.json();
}

function populateSelectPreserving(selectEl, values, allLabel){
  const current = selectEl.value;
  const distinct = [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  selectEl.innerHTML = `<option value="">${allLabel}</option>` +
    distinct.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  if(distinct.includes(current)) selectEl.value = current;
}

async function loadAndRender(){
  try{
    people = await sbGet('fishermen?select=id,name,dam,competition&order=name.asc');
    clearDbError();
  }catch(e){
    console.error(e);
    showDbError('Could not reach the database. Try refreshing.');
    return;
  }

  const el = document.getElementById('leaderboard-list');
  if(people.length===0){
    el.innerHTML = '<div class="empty">No anglers yet.</div>';
    document.getElementById('updated-line').textContent = '';
    return;
  }

  const perPersonCatches = {};
  const allTypes = [];
  for(const p of people){
    let catches = [];
    try{
      catches = await sbGet('catches?fisherman_id=eq.'+p.id+'&caught=eq.true&select=*');
    }catch(e){ console.error(e); }
    perPersonCatches[p.id] = catches;
    catches.forEach(c=>{ if(c.fish_type) allTypes.push(c.fish_type); });
  }

  populateSelectPreserving(document.getElementById('lb-filter-dam'), people.map(p=>p.dam), 'All dams');
  populateSelectPreserving(document.getElementById('lb-filter-comp'), people.map(p=>p.competition), 'All competitions');
  populateSelectPreserving(document.getElementById('lb-filter-type'), allTypes, 'All types');

  const damFilter = document.getElementById('lb-filter-dam').value;
  const compFilter = document.getElementById('lb-filter-comp').value;
  const typeFilter = document.getElementById('lb-filter-type').value;

  const stats = people
    .filter(p => (!damFilter || p.dam===damFilter) && (!compFilter || p.competition===compFilter))
    .map(p=>{
      let catches = perPersonCatches[p.id] || [];
      if(typeFilter) catches = catches.filter(c=>c.fish_type===typeFilter);
      const totalWeight = catches.reduce((s,c)=>s+(c.weight||0),0);
      const biggest = catches.reduce((b,c)=> (c.weight||0) > (b?b.weight:0) ? c : b, null);
      return {name:p.name, dam:p.dam, count:catches.length, totalWeight, biggest};
    })
    // Spectator view: only show anglers who have actually caught a fish
    .filter(s => s.count > 0);

  stats.sort((a,b)=> b.totalWeight - a.totalWeight || b.count - a.count);

  if(stats.length===0){
    el.innerHTML = '<div class="empty">No fish caught yet for these filters.</div>';
  }else{
    el.innerHTML = stats.map((s,i)=>`
      <div class="lb-item">
        <div class="lb-rank">${i+1}</div>
        <div>
          <div class="lb-name">${escapeHtml(s.name)}</div>
          <div class="lb-dam">${escapeHtml(s.dam||'')}</div>
        </div>
        <div class="lb-stats">
          <div><b>${s.totalWeight.toFixed(2)}kg</b> total</div>
          <div>${s.count} catch${s.count===1?'':'es'}${s.biggest? ' · biggest '+s.biggest.weight+'kg '+escapeHtml(s.biggest.fish_type||''):''}</div>
        </div>
      </div>`).join('');
  }
  document.getElementById('updated-line').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

document.getElementById('refresh-btn').addEventListener('click', loadAndRender);
document.getElementById('lb-filter-dam').addEventListener('change', loadAndRender);
document.getElementById('lb-filter-comp').addEventListener('change', loadAndRender);
document.getElementById('lb-filter-type').addEventListener('change', loadAndRender);

loadAndRender();
setInterval(loadAndRender, REFRESH_MS);
</script>
</body>
</html>
